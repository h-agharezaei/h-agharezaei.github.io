  [languages.fa.params]
    description = "وبسایت شخصی و وبلاگ روهام، مهندس نرم‌افزار و رهبر فنی (Go، Node.js و عامل‌های هوش مصنوعی)."
    homeTitle = "روهام | مهندس نرم‌افزار و رهبر فنی (Go و Node.js)"
    keywords = ["روهام", "مهندس نرم‌افزار", "Go", "گولنگ", "Node.js", "NATS JetStream", "بک‌اند", "سیستم‌های توزیع‌شده", "رهبر فنی", "عامل هوش مصنوعی", "LLM", "میکروسرویس"]

    [languages.fa.params.homeInfoParams]
      Title = "سلام، من روهام هستم 👋"
      Content = "مهندس نرم‌افزار و رهبر فنی با بیش از ۱۶ سال تجربه در مهندسی بک‌اند، سیستم‌های توزیع‌شده و عامل‌های هوش مصنوعی مبتنی بر LLM. از چیزهایی که یاد می‌گیرم می‌نویسم."

