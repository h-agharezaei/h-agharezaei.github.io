baseURL = 'https://justroham.ir/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
theme = 'PaperMod'
enableRobotsTXT = true

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[params]
  author = "Roham"
  mainSections = ["posts"]
  env = "production"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  defaultTheme = "auto"

  [params.schema]
    publisherType = "Person"
    sameAs = ["https://github.com/h-agharezaei", "https://www.linkedin.com/in/hossein-agharezaei/"]

# Keep thin taxonomy pages out of the sitemap
[sitemap]
  changefreq = "weekly"
  priority = 0.5

# Proper og:locale values for Open Graph (PaperMod reads params.locale)
[[cascade]]
  [cascade.params]
    locale = "en_US"
  [cascade.target.sites.matrix]
    languages = ["en"]
[[cascade]]
  [cascade.params]
    locale = "fa_IR"
  [cascade.target.sites.matrix]
    languages = ["fa"]

# Needed for PaperMod's search page
[outputs]
  home = ["HTML", "RSS", "JSON"]

# English
[languages.en]
  languageName = "English"
  languageCode = "en"
  weight = 1
  title = "Roham"

  [languages.en.params]
    description = "Personal website and blog of Roham, software engineer and tech lead (Go, Node.js & AI agents)."
    homeTitle = "Roham | Software Engineer & Tech Lead (Go & Node.js)"
    keywords = ["Roham", "software engineer", "tech lead", "Go", "Golang", "Node.js", "NATS JetStream", "backend", "distributed systems", "LLM", "AI agents", "microservices"]

    [languages.en.params.homeInfoParams]
      Title = "Hi, I'm Roham 👋"
      Content = "Software engineer and tech lead with 16+ years of experience in backend engineering, distributed systems and LLM-based AI agents. I write about what I learn along the way."

    [[languages.en.params.socialIcons]]
      name = "github"
      url = "https://github.com/h-agharezaei"
    [[languages.en.params.socialIcons]]
      name = "linkedin"
      url = "https://www.linkedin.com/in/hossein-agharezaei/"
    [[languages.en.params.socialIcons]]
      name = "rss"
      url = "/index.xml"

  [[languages.en.menu.main]]
    identifier = "posts"
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[languages.en.menu.main]]
    identifier = "projects"
    name = "Projects"
    pageRef = "/projects"
    weight = 20
  [[languages.en.menu.main]]
    identifier = "about"
    name = "About"
    pageRef = "/about"
    weight = 25
  [[languages.en.menu.main]]
    identifier = "glossary"
    name = "Glossary"
    pageRef = "/glossary"
    weight = 28
  [[languages.en.menu.main]]
    identifier = "search"
    name = "Search"
    pageRef = "/search"
    weight = 30

# Persian
[languages.fa]
  languageName = "فارسی"
  languageCode = "fa"
  languageDirection = "rtl"
