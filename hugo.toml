baseURL = 'https://h-agharezaei.github.io/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
theme = 'PaperMod'

[params]
  author = "Hossein Agharezaei"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  defaultTheme = "auto"

# English Language Settings
[languages.en]
  languageName = "English"
  languageCode = "en"
  weight = 1
  title = "Personal Website"
  
  [languages.en.params]
    description = "My personal website and blog"
    
  [[languages.en.menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10

  [[languages.en.menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 20

  [[languages.en.menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30

# Persian/Farsi Language Settings
[languages.fa]
  languageName = "فارسی"
  languageCode = "fa"
  languageDirection = "rtl"
  weight = 2
  title = "وبسایت شخصی"
  
  [languages.fa.params]
    description = "وبسایت شخصی و وبلاگ من"
    
  [[languages.fa.menu.main]]
    identifier = "home"
    name = "خانه"
    url = "/fa/"
    weight = 10

  [[languages.fa.menu.main]]
    identifier = "posts"
    name = "مقالات"
    url = "/fa/posts/"
    weight = 20

  [[languages.fa.menu.main]]
    identifier = "about"
    name = "درباره من"
    url = "/fa/about/"
    weight = 30

# تنظیمات برای GitHub Pages
[outputs]
  home = ["HTML", "RSS", "JSON"]
